name: Turkuaz Shield Android APK
on:
  push:
    branches: [turkuaz-shield-android]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turkuaz-shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TurkuazShield-debug-apk
          path: turkuaz-shield/app/build/outputs/apk/debug/app-debug.apk